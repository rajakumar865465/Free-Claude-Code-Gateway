# Nginx configuration for Free Claude Code Gateway
#
# Save as /etc/nginx/sites-available/fcc-gateway and enable with:
#   sudo ln -s /etc/nginx/sites-available/fcc-gateway /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Use certbot for HTTPS:
#   sudo certbot --nginx -d proxy.yourdomain.com

# HTTP -> HTTPS redirect (after you have a cert)
# server {
#     listen 80;
#     server_name proxy.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name proxy.yourdomain.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
        proxy_cache off;
    }

    # SSE endpoints need a much longer read timeout so that long-running AI
    # responses and the admin event stream are not cut off mid-stream.
    # The admin heartbeat fires every 15s, so even idle SSE connections stay alive.
    location ~ ^/(v1/messages|admin/api/events) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection '';

        # Allow up to 10 minutes for streaming AI responses
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;

        proxy_buffering off;
        proxy_cache off;
        # Tell nginx not to buffer SSE responses
        proxy_set_header X-Accel-Buffering no;
    }
}
